name: BCP Scheduling CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:

  php-check:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          set -e

          find app scripts -type f -name "*.php" \
            ! -name "*.bak*" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            php -l "$file"
          done

          php -l index.php
          php -l logout.php

  python-check:
    name: Python Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: python-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        working-directory: python-backend
        run: |
          python -m compileall -q app

      - name: Test FastAPI import
        working-directory: python-backend
        env:
          PYTHONPATH: .
        run: |
          python -c "from app.main import app; print('FastAPI import OK')"

  repository-check:
    name: Repository Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for .env
        shell: bash
        run: |
          if find . \
            -path './.git' -prune -o \
            -name '.env' -print | grep -q .; then
            echo "ERROR: .env must not be committed."
            exit 1
          fi

      - name: Check for .venv
        shell: bash
        run: |
          if find . \
            -path './.git' -prune -o \
            -path './python-backend/.venv' -print | grep -q .; then
            echo "ERROR: python-backend/.venv must not be committed."
            exit 1
          fi